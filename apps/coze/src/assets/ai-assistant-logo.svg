<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 机器人头部 -->
  <rect x="8" y="6" width="24" height="18" rx="6" fill="url(#headGradient)" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- 机器人眼睛 -->
  <circle cx="14" cy="13" r="2" fill="url(#eyeGradient)"/>
  <circle cx="26" cy="13" r="2" fill="url(#eyeGradient)"/>

  <!-- 机器人嘴巴 -->
  <path d="M16 18 C16 18, 20 21, 24 18" stroke="url(#mouthGradient)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- 机器人天线 -->
  <line x1="20" y1="6" x2="20" y2="3" stroke="url(#antennaGradient)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="2" r="1.5" fill="url(#antennaBallGradient)"/>

  <!-- 机器人身体 -->
  <rect x="10" y="24" width="20" height="12" rx="4" fill="url(#bodyGradient)" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- 机器人身体细节 -->
  <rect x="14" y="27" width="12" height="6" rx="2" fill="url(#screenGradient)" opacity="0.8"/>
  <circle cx="17" cy="30" r="1" fill="#40a9ff"/>
  <circle cx="23" cy="30" r="1" fill="#40a9ff"/>

  <!-- 机器人手臂 -->
  <rect x="4" y="26" width="6" height="8" rx="3" fill="url(#armGradient)" stroke="url(#borderGradient)" stroke-width="1.5"/>
  <rect x="30" y="26" width="6" height="8" rx="3" fill="url(#armGradient)" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- 渐变定义 -->
  <defs>
    <!-- 主体渐变 -->
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40a9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="armGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#69c0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40a9ff;stop-opacity:1" />
    </linearGradient>

    <!-- 边框渐变 -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#096dd9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0050b3;stop-opacity:1" />
    </linearGradient>

    <!-- 眼睛渐变 -->
    <radialGradient id="eyeGradient">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
    </radialGradient>

    <!-- 嘴巴渐变 -->
    <linearGradient id="mouthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#40a9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:1" />
    </linearGradient>

    <!-- 天线渐变 -->
    <linearGradient id="antennaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#69c0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:1" />
    </linearGradient>

    <!-- 天线球渐变 -->
    <radialGradient id="antennaBallGradient">
      <stop offset="0%" style="stop-color:#69c0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:1" />
    </radialGradient>

    <!-- 屏幕渐变 -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>