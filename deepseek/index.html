<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DeepSeek AI助手项目" />
  <meta name="keywords" content="AI, DeepSeek, 助手, 前端开发" />
  <meta name="author" content="开发者" />
  <title>DeepSeek项目 - AI助手</title>
</head>

<body>
  <div id="app">
    <!-- 导航栏 -->
    <nav class="navbar">
      <div class="nav-container">
        <h1 class="nav-logo">DeepSeek项目</h1>

        <!-- 主题切换按钮 -->
        <div class="theme-switcher">
          <button class="theme-btn" id="theme-light" aria-label="亮色主题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" />
              <path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="theme-btn" id="theme-dark" aria-label="暗色主题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" stroke="currentColor" stroke-width="2" />
              <path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button class="theme-btn" id="theme-auto" aria-label="跟随系统">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" />
              <path d="M12 3v2M5 5l1.5 1.5M19 5l-1.5 1.5M12 19v2M5 19l1.5-1.5M19 19l-1.5-1.5" stroke="currentColor"
                stroke-width="2" />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
      <section id="deepseek" class="deepseek-section">
        <div class="container">
          <div class="deepseek-content">
            <h3>🤖 DeepSeek AI 助手</h3>
            <p>与DeepSeek AI进行智能对话</p>

            <button class="start-chat-btn" id="start-chat-btn">
              开始对话
            </button>

            <div class="deepseek-card" id="deepseek-card" style="display: none">
              <div class="deepseek-header">
                <h4>AI回复</h4>
                <div class="loading-indicator" id="deepseek-loading" style="display: none">
                  <span class="loading-dot"></span>
                  <span class="loading-dot"></span>
                  <span class="loading-dot"></span>
                </div>
              </div>
              <div class="deepseek-response" id="reply">
                <p>点击发送按钮后，AI将开始思考...</p>
              </div>
              <div class="deepseek-input-container">
                <textarea id="user-input" class="deepseek-textarea" placeholder="请输入您要与AI对话的内容..."></textarea>
                <button id="send-message-btn" class="send-message-btn">
                  发送
                </button>
              </div>
            </div>

            <button class="close-deepseek" id="close-deepseek-btn" style="display: none">
              关闭
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 DeepSeek项目. AI助手应用.</p>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
